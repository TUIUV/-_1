plugins {
    id "com.android.application"
    id "kotlin-android"
    // يجب تطبيق إضافة Flutter بعد إضافتي Android وKotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.sawtiassistant"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.sawtiassistant"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // توقيع debug ليكون APK الإصدار قابلاً للتثبيت مباشرة.
            // للنشر الحقيقي أنشئ مفتاح توقيع خاصاً بك.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
